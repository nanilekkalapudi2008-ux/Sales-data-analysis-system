{% extends "base.html" %}

{% block title %}Register - Sales Data Analysis System{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card" style="max-width: 500px;">
        <div class="auth-header">
            <h2>📝 Create Account</h2>
            <p>Sales Data Analysis System</p>
        </div>
        <div class="auth-body">
            <form method="POST" action="{{ url_for('register') }}">
                <div class="form-group">
                    <label class="form-label" for="full_name">Full Name</label>
                    <input 
                        type="text" 
                        class="form-control" 
                        id="full_name" 
                        name="full_name" 
                        placeholder="e.g. John Doe" 
                        value="{{ full_name if full_name else '' }}"
                        required
                    >
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="email">Email Address</label>
                        <input 
                            type="email" 
                            class="form-control" 
                            id="email" 
                            name="email" 
                            placeholder="john@example.com" 
                            value="{{ email if email else '' }}"
                            required
                        >
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="username">Username</label>
                        <input 
                            type="text" 
                            class="form-control" 
                            id="username" 
                            name="username" 
                            placeholder="e.g. johndoe" 
                            value="{{ username if username else '' }}"
                            required
                        >
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="password">Password (min 6 chars)</label>
                        <input 
                            type="password" 
                            class="form-control" 
                            id="password" 
                            name="password" 
                            placeholder="Create password" 
                            minlength="6"
                            required
                        >
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="confirm_password">Confirm Password</label>
                        <input 
                            type="password" 
                            class="form-control" 
                            id="confirm_password" 
                            name="confirm_password" 
                            placeholder="Confirm password" 
                            minlength="6"
                            required
                        >
                    </div>
                </div>
                <div style="margin-top: 1.5rem; display: flex; flex-direction: column; gap: 0.75rem;">
                    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">
                        ✨ Create Account
                    </button>
                    <a href="{{ url_for('login') }}" class="btn btn-secondary" style="width: 100%; padding: 0.65rem;">
                        ← Back to Login
                    </a>
                </div>
            </form>
        </div>
        <div class="auth-footer">
            <p>Already have an account? <a href="{{ url_for('login') }}">Sign In</a></p>
        </div>
    </div>
</div>
{% endblock %}
